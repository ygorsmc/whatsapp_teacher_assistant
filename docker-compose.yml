version: '3.8'

services:
  # Redis — Filas (Redis Streams), debouncing, histórico de conversas e tracking de janelas de 24h
  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # PostgreSQL — Banco de dados relacional (substituiu o Azure SQL / SQL Edge)
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=whatsapp
      - POSTGRES_PASSWORD=whatsapp_dev_2026
      - POSTGRES_DB=whatsapp_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Qdrant para o banco vetorial local (RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: whatsapp_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Gotenberg — Conversão de DOCX/PPTX para PDF (para o parser de documentos)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-port=3000"

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
