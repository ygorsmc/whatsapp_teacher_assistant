services:
  # Redis — Filas (Redis Streams), debouncing, histórico de conversas e tracking de janelas de 24h
  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # PostgreSQL — Banco de dados relacional (substituiu o Azure SQL / SQL Edge)
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=whatsapp
      - POSTGRES_PASSWORD=whatsapp_dev_2026
      - POSTGRES_DB=whatsapp_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Qdrant para o banco vetorial local (RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: whatsapp_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Gotenberg — Conversão de DOCX/PPTX para PDF (para o parser de documentos)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-port=3000"

  # Reranker (F4) — microserviço PyTorch CUDA (cross-encoder) servindo o MESMO
  # contrato /rerank do TEI, consumido pelo provider `open` (OpenReranker)
  # (RERANKER_PROVIDER=open + OPEN_RERANKER_ENDPOINT=http://localhost:8080/rerank).
  #
  # Por que não o TEI: a imagem `turing-*` do TEI (Candle) não tem kernels SM75
  # otimizados → subutiliza a GTX 1660 Ti (~0.6s/doc). O PyTorch usa cuBLAS na
  # SM75 com eficiência (~10-30ms/doc). Mesmo modelo, mesmo contrato HTTP.
  # Requer nvidia-container-toolkit. Sem GPU: remover o bloco `deploy` (cai p/ CPU).
  reranker:
    build:
      context: ./docker/reranker
    image: whatsapp-local-reranker:latest
    container_name: whatsapp_reranker
    ports:
      - "8080:80"
    environment:
      - RERANK_MODEL=BAAI/bge-reranker-v2-m3
      # Modelo já em cache no volume → offline evita o hang de rate-limit do HF Hub
      # em requests não autenticados. Ao trocar de modelo (1ª vez), pôr como 0.
      - HF_HUB_OFFLINE=1
    volumes:
      - tei_data:/data   # cache HF (HF_HUB_CACHE=/data) — modelo persiste entre recreates
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  tei_data:
