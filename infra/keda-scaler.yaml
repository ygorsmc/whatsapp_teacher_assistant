# keda-scaler.yaml
# Escalonamento Automático (KEDA) para o Worker do Azure Container Apps
# Este manifesto instrui o ACA a criar réplicas baseadas no tamanho da fila do Service Bus.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm-worker-scaler
  namespace: whatsapp-assistant
spec:
  scaleTargetRef:
    name: worker-llm # Nome do container app do worker
  pollingInterval: 10 # Verifica a fila a cada 10 segundos
  cooldownPeriod: 60  # Espera 60s antes de matar o container após a fila esvaziar
  minReplicaCount: 0  # Escala para ZERO para economizar 100% quando não houver alunos enviando mensagens!
  maxReplicaCount: 10 # Previne estourar o limite de custo ou rate-limit das APIs
  triggers:
  # TRIGER 1: Redis Streams (Novo padrão cloud-agnostic)
  - type: redis-streams
    metadata:
      address: redis-master.redis.svc.cluster.local:6379 # Atualizar para endereço do Azure Cache for Redis se usar PaaS
      stream: inbound_messages
      consumerGroup: messaging_workers
      pendingEntriesCount: "5"
    # authenticationRef: 
    #   name: keda-redis-auth
      
  # TRIGER 2: Azure Service Bus (Legado/Opcional)
  # - type: azure-servicebus
  #   metadata:
  #     queueName: inbound_messages
  #     messageCount: "5"
  #   authenticationRef:
  #     name: keda-mi-auth

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-mi-auth
  namespace: whatsapp-assistant
spec:
  podIdentity:
    provider: azure
