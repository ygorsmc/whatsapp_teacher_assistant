name: Build, Test, and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Require for OIDC (Azure Workload Identity)
  contents: read

jobs:
  test:
    name: Code Quality and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-mock pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type checking with Mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run Tests
        run: pytest tests/

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Webhook Image
        run: |
          docker build -f Dockerfile.webhook -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-webhook:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-webhook:${{ github.sha }}

      - name: Build and Push Worker Image
        run: |
          docker build -f Dockerfile.worker -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }}

      - name: Deploy to Azure Container Apps (Webhook)
        run: |
          az containerapp update -n webhook-app -g ${{ secrets.RESOURCE_GROUP }} --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-webhook:${{ github.sha }}

      - name: Deploy to Azure Container Apps (Worker LLM)
        run: |
          az containerapp update -n worker-llm -g ${{ secrets.RESOURCE_GROUP }} --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }}

      - name: Deploy to Azure Container Apps (Worker Scheduler)
        run: |
          az containerapp update -n worker-scheduler -g ${{ secrets.RESOURCE_GROUP }} --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }}
