name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Require for OIDC (Azure Workload Identity)
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Webhook Image
        run: |
          docker build -f Dockerfile.webhook -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-webhook:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-webhook:${{ github.sha }}

      - name: Build and Push Worker Image
        run: |
          docker build -f Dockerfile.worker -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }}

      - name: Deploy to Azure Container Apps (Webhook)
        uses: azure/container-apps-deploy-action@v3
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ secrets.REGISTRY_NAME }}
          containerAppName: webhook-app
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-webhook:${{ github.sha }}

      - name: Deploy to Azure Container Apps (Worker)
        uses: azure/container-apps-deploy-action@v3
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ secrets.REGISTRY_NAME }}
          containerAppName: worker-llm
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatsapp-worker:${{ github.sha }}
